name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}, ${{ matrix.mm }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 has a weaker memory model than amd64, so it can expose
        # missing acquire/release orderings that amd64 hides.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mm: [arc, orc, atomicArc]
    env:
      NIM_VERSION: 2.2.12
      # --skipParentCfg keeps config.nims from forcing --mm:atomicArc.
      # -d:release keeps runtime checks and assertions but optimizes, which is
      # likelier to expose memory-ordering bugs. `nim testAll` also runs debug.
      NIM_ARGS: --skipParentCfg --threads:on --mm:${{ matrix.mm }} -d:release
    steps:
      - uses: actions/checkout@v4

      - name: Cache Atlas deps
        uses: actions/cache@v4
        with:
          # `atlas env` installs Nim under deps/, so key on the architecture.
          path: deps
          key: ${{ runner.os }}-${{ runner.arch }}-nim-${{ env.NIM_VERSION }}-atlas-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nim-${{ env.NIM_VERSION }}-atlas-

      - name: Install Atlas
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Check versions
        run: |
          uname -m
          nim -v
          atlas -v
          atlas-run -v

      - name: Install dependencies
        run: atlas install

      - name: Run tests
        run: atlas-run tests --only-errors -- $NIM_ARGS

      - name: Run container tests with --threads:off
        run: atlas-run tests --only-errors ttriemap ttriemultimap ttrieset ttrievec tflexvec tbox timmstr tflexstr tjsonutils -- $NIM_ARGS --threads:off

      - name: Run container tests against thetos/local
        run: atlas-run tests --only-errors ttriemap ttriemultimap ttrieset ttrievec tflexvec tbox timmstr tflexstr -- $NIM_ARGS -d:thetosTestLocal
