name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.mm }}${{ matrix.mode && ', release' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mm: [arc, orc, atomicArc]
        mode: ['', '-d:release']
    env:
      # --skipParentCfg keeps config.nims from forcing --mm:atomicArc.
      NIM_ARGS: --skipParentCfg --threads:on --mm:${{ matrix.mm }} ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'

      - name: Cache Atlas deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-atlas-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-atlas-

      - name: Add Atlas to PATH
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Atlas
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -

      - name: Check Atlas version
        run: |
          atlas -v
          atlas-run -v

      - name: Install dependencies
        run: atlas install

      - name: Run tests
        run: atlas-run tests --only-errors -- $NIM_ARGS

      - name: Run container tests with --threads:off
        run: atlas-run tests --only-errors ttriemap ttrieset ttrievec tflexvec tbox -- $NIM_ARGS --threads:off

      - name: Run container tests against thetos/local
        run: atlas-run tests --only-errors ttriemap ttrieset ttrievec tflexvec tbox -- $NIM_ARGS -d:thetosTestLocal
